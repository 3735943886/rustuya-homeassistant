[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustuya-homeassistant"
version = "0.1.0"
description = "Generate & sync Home Assistant MQTT discovery for rustuya-bridge Tuya devices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "paho-mqtt>=2.0",
]

[project.scripts]
rustuya-ha = "rustuya_ha.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rustuya_ha"]

[tool.hatch.build.targets.wheel.force-include]
"src/rustuya_ha/data/custom_converters.json" = "rustuya_ha/data/custom_converters.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
