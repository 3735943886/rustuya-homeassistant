[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustuya-homeassistant"
version = "0.0.1"
description = "Generate & sync Home Assistant MQTT discovery for rustuya-bridge Tuya devices"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "3735943886" }]
keywords = ["tuya", "home-assistant", "mqtt", "discovery", "rustuya-bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "paho-mqtt>=2.0",
]

[project.urls]
Homepage = "https://github.com/3735943886/rustuya-homeassistant"
Repository = "https://github.com/3735943886/rustuya-homeassistant"

[project.scripts]
rustuya-ha = "rustuya_ha.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rustuya_ha"]

[tool.hatch.build.targets.wheel.force-include]
"src/rustuya_ha/data/custom_converters.json" = "rustuya_ha/data/custom_converters.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
