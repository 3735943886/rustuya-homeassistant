[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustuya-homeassistant"
version = "0.0.1rc22"
description = "Generate & sync Home Assistant MQTT discovery for rustuya-bridge Tuya devices"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "3735943886" }]
keywords = ["tuya", "home-assistant", "mqtt", "discovery", "rustuya-bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
# Installs the host this plugin plugs into. With `pip install rustuya-homeassistant[manager]`
# the entry-point below is discovered by rustuya-manager and an "HA Discovery" tab appears.
# The dependency arrow is one-way: rustuya-ha -> rustuya-manager, never the reverse.
manager = [
    "rustuya-manager>=0.1.0rc29",
]

[project.entry-points."rustuya_manager.plugins"]
discovery = "rustuya_ha.manager_plugin:register"

[project.urls]
Homepage = "https://github.com/3735943886/rustuya-homeassistant"
Repository = "https://github.com/3735943886/rustuya-homeassistant"

[project.scripts]
rustuya-ha = "rustuya_ha.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rustuya_ha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
