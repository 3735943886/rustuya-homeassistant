name: publish

# Trusted Publishing (OIDC) — no API tokens stored.
#
# Register the publisher on BOTH indexes (owner: 3735943886,
# repo: rustuya-homeassistant, workflow: publish.yml):
#   - TestPyPI: environment = testpypi   (use a "pending publisher" — the
#     project doesn't exist there yet)
#   - PyPI:     environment = pypi        (likewise, pending publisher)
#
# How to release:
#   - Rehearse on TestPyPI:  Actions -> publish -> "Run workflow" (workflow_dispatch)
#   - Release to PyPI:       push a tag  v0.0.1  (must match pyproject version)
#
# A tag push also attaches the built wheel + sdist to a GitHub Release (the
# `release` job), so the plugin can be grabbed without pip/PyPI — handy for the
# Docker drop-in: download the wheel from the Releases page and unzip just the
# `rustuya_ha/` package into the manager's /data/plugins. rc* tags are marked as
# pre-releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sanity-check that the tag matches the package version
        # On a tag push, the tag (minus leading `v`) must equal pyproject's
        # [project].version — the artifact published below is built from
        # pyproject, not the tag. Catches the easy mistake of tagging without
        # bumping the version (or pushing the wrong repo's tag here). Skipped on
        # workflow_dispatch (TestPyPI rehearsal), which has no tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "Tag v$TAG does not match pyproject version $PKG_VER" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - run: pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    # Attach the built artifacts to a GitHub Release on tag push, so the package
    # is downloadable without pip/PyPI (e.g. for the manager Docker drop-in).
    # Independent of `pypi` — a PyPI hiccup must not block the GitHub Release,
    # and vice versa; both just consume the same `dist` artifact from `build`.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # rc / a / b / dev tags are pre-releases; a bare vX.Y.Z is a full release.
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'dev') }}
          generate_release_notes: true
