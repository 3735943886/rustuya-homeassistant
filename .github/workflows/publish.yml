name: publish

# Trusted Publishing (OIDC) — no API tokens stored.
#
# Register the publisher on BOTH indexes (owner: 3735943886,
# repo: rustuya-homeassistant, workflow: publish.yml):
#   - TestPyPI: environment = testpypi   (use a "pending publisher" — the
#     project doesn't exist there yet)
#   - PyPI:     environment = pypi        (likewise, pending publisher)
#
# How to release:
#   - Rehearse on TestPyPI:  Actions -> publish -> "Run workflow" (workflow_dispatch)
#   - Release to PyPI:       push a tag  v0.0.1  (must match pyproject version)
#
# A tag push also attaches the built wheel + sdist to a GitHub Release (the
# `release` job), plus a `rustuya_ha-<version>-dropin.zip` — a reproducible zip
# of just the importable `rustuya_ha/` package, built by scripts/build_dropin.py.
# That is the exact artifact rustuya-manager's plugin catalog downloads and
# SHA-256-verifies before unpacking into /data/plugins; the catalog entry's url
# points at this release asset. rc* tags are marked as pre-releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sanity-check that the tag matches the package version
        # On a tag push, the tag (minus leading `v`) must equal pyproject's
        # [project].version — the artifact published below is built from
        # pyproject, not the tag. Catches the easy mistake of tagging without
        # bumping the version (or pushing the wrong repo's tag here). Skipped on
        # workflow_dispatch (TestPyPI rehearsal), which has no tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "Tag v$TAG does not match pyproject version $PKG_VER" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - run: pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Build the drop-in plugin zip (for the rustuya-manager catalog)
        # Reproducible (pinned timestamps/order, ZIP_STORED): the manager rejects
        # any artifact whose hash differs from its catalog entry, so these bytes
        # must match what scripts/build_dropin.py produced when plugins.json was
        # pinned. The printed sha256 is the value that lives in that catalog.
        # Built into its own dir/artifact (not dist/) so it never reaches the
        # PyPI upload, which would reject a non-wheel/sdist zip.
        run: python scripts/build_dropin.py --outdir dropin
      - uses: actions/upload-artifact@v7
        with:
          name: dropin
          path: dropin/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    # Attach the built artifacts to a GitHub Release on tag push, so the package
    # is downloadable without pip/PyPI (e.g. for the manager Docker drop-in).
    # Independent of `pypi` — a PyPI hiccup must not block the GitHub Release,
    # and vice versa; both just consume the same `dist` artifact from `build`.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release + upload assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: dropin
          path: dropin/
      - name: Extract this release's section from CHANGELOG.md
        # The hand-curated CHANGELOG.md is the single source of truth for release
        # notes. Pull only the `## [<version>]` section (up to the next `## [`)
        # for the GitHub Release body. GitHub's own generate_release_notes only
        # lists merged PRs — most changes here land as direct commits, so they'd
        # be invisible — and its "previous tag" heuristic skips pre-releases.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") { cap=1; next }
            cap && /^## \[/ { exit }
            cap { print }
          ' CHANGELOG.md | sed '1{/^$/d}' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
            dropin/*
          # rc / a / b / dev tags are pre-releases; a bare vX.Y.Z is a full release.
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'dev') }}

  notify-catalog:
    # Nudge rustuya-manager to refresh its plugin catalog now, instead of waiting
    # for its daily cron — so a fresh release is downloadable from the manager UI
    # immediately. Cross-repo, so it needs a PAT: the default GITHUB_TOKEN can't
    # reach another repo. Without the secret the step simply no-ops (the daily
    # cron still covers it). PAT scope: rustuya-manager → Contents: write.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN }}
    steps:
      - name: Dispatch catalog sync to rustuya-manager
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh api --method POST repos/3735943886/rustuya-manager/dispatches \
            -f event_type=plugin-released
